name: Backend tests

on:
  push:
    branches:
      - main
      - "fix/backend-research-pipeline-audit"
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run isolated backend tests
        run: python -m pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend1/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend1
        run: npm ci
      - name: Lint frontend
        working-directory: frontend1
        run: npm run lint
      - name: Type-check and build frontend
        working-directory: frontend1
        run: npm run build
